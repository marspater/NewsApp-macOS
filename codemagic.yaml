workflows:
  news-arm64-verification:
    name: News macOS arm64 verification
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "27.0"
      vars:
        TARGET_MACOS: "15.0"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    # SwiftPM checkouts and dependency builds, as in the GitHub Actions and CircleCI caches.
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.build
        - $CM_BUILD_DIR/build/DerivedData/SourcePackages
        - $HOME/Library/Caches/org.swift.swiftpm
    # Changes that cannot affect the app need no macOS build: the list in script/ci_changes.sh, which GitHub Actions
    # and CircleCI run, less this file. Globs cannot re-include PRIVACY.md, which a test checks exists.
    when:
      changeset:
        includes:
          - '.'
        excludes:
          - 'docs/**'
          - '**/*.md'
          - 'LICENSE'
          - 'NOTICE'
          - 'changelog/**'
          - 'script/evaluation/**'
          - 'script/training/**'
          - '.github/**'
          - '.circleci/**'
          - '.codacy*'
          - '.coderabbit.yaml'
          - '.sonarcloud.properties'
          - '.claude/**'
          - '.gitignore'
    scripts:
      - name: Verify Apple Silicon and toolchain
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p build/ci
          {
            test "$(uname -m)" = arm64
            xcodebuild -version > build/ci/xcode-version.log
            grep -q '^Xcode 27\.0$' build/ci/xcode-version.log
            sw_vers
            cat build/ci/xcode-version.log
            swift --version
          } 2>&1 | tee build/ci/environment.log
      - name: Run full offline regressions
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          ./test.sh 2>&1 | tee build/ci/tests.log
          script/format.sh --check 2>&1 | tee build/ci/format.log
      # Native Swift Testing target (#1070), as on GitHub Actions; it holds the publisher-excerpt checks (#577).
      - name: Run native tests
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          status=0
          xcodebuild test -project News.xcodeproj -scheme News -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData -testPlan Release \
            -resultBundlePath build/ci/NewsTests.xcresult -quiet 2>&1 | tee build/ci/native-tests.log || status=$?
          if [[ -d build/ci/NewsTests.xcresult ]]; then
            ditto -c -k --keepParent build/ci/NewsTests.xcresult build/ci/NewsTests.xcresult.zip
          fi
          exit "$status"
      # NewsUITests (#1070), as on GitHub Actions.
      - name: Run UI tests
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          status=0
          xcodebuild test -project News.xcodeproj -scheme News -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData -testPlan UITests -only-testing:NewsUITests \
            -resultBundlePath build/ci/NewsUITests.xcresult -quiet 2>&1 | tee build/ci/ui-tests.log || status=$?
          if [[ -d build/ci/NewsUITests.xcresult ]]; then
            ditto -c -k --keepParent build/ci/NewsUITests.xcresult build/ci/NewsUITests.xcresult.zip
          fi
          exit "$status"
      - name: Verify SwiftPM app target
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          swift build --force-resolved-versions --target News 2>&1 | tee build/ci/swiftpm.log
      - name: Build ad-hoc arm64 app
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          ./build_release.sh 2>&1 | tee build/ci/build.log
      - name: Verify and archive app
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          {
            test -x News.app/Contents/MacOS/News
            plutil -lint News.app/Contents/Info.plist
            test "$(lipo -archs News.app/Contents/MacOS/News)" = arm64
            codesign --verify --deep --strict --verbose=2 News.app
            codesign -dvv News.app 2> build/ci/signature.log
            grep -q 'flags=.*runtime' build/ci/signature.log
            codesign -d --entitlements - --xml News.app > build/ci/entitlements.plist
            test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' build/ci/entitlements.plist)" = true
            ditto -c -k --sequesterRsrc --keepParent News.app build/News-arm64-verification.zip
            (cd build && shasum -a 256 News-arm64-verification.zip > News-arm64-verification.zip.sha256)
          } 2>&1 | tee build/ci/verification.log
    artifacts:
      - build/News-arm64-verification.zip
      - build/News-arm64-verification.zip.sha256
      - build/ci/*.log
      - build/ci/entitlements.plist
      - build/ci/NewsTests.xcresult.zip
      - build/ci/NewsUITests.xcresult.zip
