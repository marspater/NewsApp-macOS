app-code:
  - changed-files:
      - any-glob-to-any-file: 'Sources/**'

# Only PRs that change nothing but tests: most PRs touch Tests/ alongside the code.
tests:
  - changed-files:
      - all-globs-to-all-files: 'Tests/**'

build-infra:
  - changed-files:
      - any-glob-to-any-file:
          - 'BuildSupport/**'
          - 'script/**'
          - '*.sh'
          - 'Makefile'
          - 'Package.swift'
          - 'Package.resolved'
          - 'codemagic.yaml'
          - '.circleci/**'
          - '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'changelog/**'
          - '*.md'
