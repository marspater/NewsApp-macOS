name: CI

on:
  # Every push to main starts the workflow; the `changes` job decides what it needs, with the same rule as for pull
  # requests (script/ci_changes.sh).
  push:
    branches: [ main ]
  # `closed` starts a run in the PR's concurrency group, which cancels its in-flight run
  # so merged PRs stop holding macOS runners; every job skips on that run.
  # The group keys on the PR number: a merged PR's `closed` run has `github.ref` set to
  # main, so a ref-keyed group would cancel main's run instead of the PR's.
  # Every base branch: a stacked pull request targets the branch below it, and main's required checks apply to the
  # whole stack. With a base filter its checks would wait forever. Results belong to the head commit, so they still
  # count after GitHub retargets the pull request to main.
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review, closed ]
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on main queue instead: a cancelled main run has spent its
# minutes and verified nothing (23 of 32 sampled test runs, 12 to 14 November). GitHub keeps one run going and one
# waiting, and a newer push replaces the waiting run before it starts, so a burst of merges costs two runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # `Changed paths` and `Build Verification (Apple Silicon)` are required checks on main (the test job is not), so the
  # workflow starts for every pull request and this job decides whether the macOS jobs have anything to test. A
  # skipped job satisfies a required check; a workflow that never starts leaves it waiting. script/ci_changes.sh is
  # the rule, shared with CircleCI. If this job fails, the macOS jobs are skipped, and only its own failure blocks
  # the merge.
  changes:
    name: Changed paths
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # script/ci_push_base.sh reads this workflow's finished runs on main
    outputs:
      code: ${{ steps.filter.outputs.code }}
      evaluation: ${{ steps.filter.outputs.evaluation }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request against its merge base with its own base branch (the branch below it in a stack); a push
      # against the last main commit this workflow finished on, so a waiting run that a newer push replaced is
      # covered by the newer one. A manual run has no range and runs everything. A failing rule fails this required
      # job instead of skipping the macOS jobs.
      - name: Detect changes that cannot affect the app
        id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$(git merge-base "$PR_BASE" "$PR_HEAD" || echo unknown); head=$PR_HEAD ;;
            push) base=$(script/ci_push_base.sh ci.yml "$BEFORE"); head=$GITHUB_SHA ;;
            *) base=unknown; head=$GITHUB_SHA ;;
          esac
          echo "Measured from $base"
          code=$(script/ci_changes.sh "$base" "$head" '^\.github/workflows/ci\.yml$')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          evaluation=true
          if changed=$(git diff --name-only "$base" "$head" 2>/dev/null) && ! grep -q '^script/evaluation/' <<< "$changed"; then
            evaluation=false
          fi
          echo "evaluation=$evaluation" >> "$GITHUB_OUTPUT"

  # macOS 26 runtime coverage (#663): CircleCI and Codemagic already run this suite on macOS 27 with Xcode 27.
  # The runner has no Xcode 27, so code built only with the macOS 27 SDK is left out here.
  test-arm64:
    name: Test (macOS 26, Apple Silicon)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: System Environment Info
        run: |
          echo "Host OS: $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          echo "Architecture: $(uname -m)"
          echo "Swift CLI: $(swift --version | head -n 1)"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          [[ "$(sw_vers -productVersion)" == 26.* ]]

      - name: Ensure Executable Permissions
        run: chmod +x test.sh build.sh build_release.sh

      # Xcode 26.6 package checkouts and build products: a cache of their own, apart from the Xcode 27 build job's.
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-xcode26-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-xcode26-

      - name: Run Unit Tests
        run: ./test.sh

      # Native Swift Testing target (#1070): the suites ported so far, alongside the runner's copies until parity, and
      # the publisher-excerpt checks that used to build NewsHarness here (#577).
      - name: Run Native Tests
        run: |
          set -o pipefail
          xcodebuild test -project News.xcodeproj -scheme News -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData -testPlan Release \
            -resultBundlePath "$RUNNER_TEMP/NewsTests.xcresult" -quiet

      - name: Upload Native Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-tests-xcresult
          path: ${{ runner.temp }}/NewsTests.xcresult
          if-no-files-found: warn
          retention-days: 14

      # NewsUITests (#1070): smoke flows against the Debug app on a fresh library and a fixture feed. Agents never
      # run UI automation on my Mac, so CI is where these run.
      - name: Run UI Tests
        run: |
          set -o pipefail
          xcodebuild test -project News.xcodeproj -scheme News -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData -testPlan UITests -only-testing:NewsUITests \
            -resultBundlePath "$RUNNER_TEMP/NewsUITests.xcresult" -quiet

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-xcresult
          path: ${{ runner.temp }}/NewsUITests.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Swift Package Manager Build
        run: swift build --force-resolved-versions --target News

  # The Phase 0 editorial matrix is Python alone, so it runs on Linux: when the evaluation tooling changes and on
  # every push to main. Its unit tests run with the other Python checks (script/python_checks.sh).
  editorial-matrix:
    name: Editorial Matrix
    needs: changes
    if: needs.changes.outputs.evaluation == 'true' || (github.event_name != 'pull_request' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Phase 0 Editorial Matrix
        run: |
          python3 -m script.evaluation.editorial_matrix \
            --database "$RUNNER_TEMP/editorial-phase0.sqlite3" \
            --output "$RUNNER_TEMP/editorial-matrix.json"

      - name: Upload Phase 0 Editorial Matrix
        uses: actions/upload-artifact@v7
        with:
          name: editorial-phase0-matrix
          path: |
            ${{ runner.temp }}/editorial-matrix.json
            ${{ runner.temp }}/editorial-phase0.sqlite3
          if-no-files-found: error
          retention-days: 14

  # Today edition captures on macOS 26 (#937): Tests/Harness/TodayCaptures.swift renders the card variants and the
  # page without a window, from fictional stories and drawn photos; the unsandboxed harness opens no library but an
  # empty one in the temporary directory. Pushes to main and manual runs only, so pull requests wait for nothing
  # more. Not a required check.
  today-captures:
    name: Today Captures (macOS 26, Apple Silicon)
    needs: changes
    # A push to main that changes nothing the app or its tests read reports code == 'false' and renders nothing.
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # tags and commit count stamp the bundle version

      - name: System Environment Info
        run: |
          echo "Host OS: $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          [[ "$(sw_vers -productVersion)" == 26.* ]]

      - name: Render Today Captures
        run: |
          NEWS_CONFIGURATION=Debug NEWS_NATIVE_HARNESS=Tests/Harness/TodayCaptures.swift \
            script/native_performance_baseline.sh "$RUNNER_TEMP/today-captures"

      - name: Upload Today Captures
        uses: actions/upload-artifact@v7
        with:
          name: today-captures-macos26
          path: ${{ runner.temp }}/today-captures/*.png
          if-no-files-found: error
          retention-days: 14

  build-arm64:
    name: Build Verification (Apple Silicon)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags and commit count stamp the bundle version

      - name: Ensure Executable Permissions
        run: chmod +x build_release.sh

      # On the shipping toolchain: swift-format output can differ between Xcode versions.
      - name: Check Swift Formatting
        run: script/format.sh --check

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-xcode27-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-xcode27-

      - name: Build Ad-hoc arm64 Verification Bundle
        run: ./build_release.sh

      - name: Verify Bundle Integrity & Hardened Runtime
        run: |
          set -euo pipefail
          test -d "News.app"
          test -x "News.app/Contents/MacOS/News"
          plutil -lint "News.app/Contents/Info.plist"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "News.app/Contents/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          ARCHS=$(lipo -archs "News.app/Contents/MacOS/News")
          echo "Found architectures: $ARCHS"
          [[ "$ARCHS" == arm64 ]]

          codesign --verify --deep --strict --verbose=2 "News.app"
          codesign -dvvv --entitlements :- "News.app"

          echo "Gatekeeper assessment (informational for ad-hoc signing):"
          spctl -a -vvv "News.app" || true

      - name: Archive Verification Bundle
        run: ditto -c -k --sequesterRsrc --keepParent News.app "News-${VERSION}-arm64-verification.zip"

      - name: Upload Verification Artifact
        uses: actions/upload-artifact@v7
        with:
          name: News-${{ env.VERSION }}-arm64-verification
          path: News-${{ env.VERSION }}-arm64-verification.zip
          if-no-files-found: error
