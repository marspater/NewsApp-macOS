name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  # `closed` starts a run in the PR's concurrency group, which cancels its in-flight run
  # so merged PRs stop holding macOS runners; every job skips on that run.
  # The group keys on the PR number: a merged PR's `closed` run has `github.ref` set to
  # main, so a ref-keyed group would cancel main's run instead of the PR's.
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS 26 runtime coverage (#663): CircleCI and Codemagic already run this suite on macOS 27 with Xcode 27.
  # The runner has no Xcode 27, so code built only with the macOS 27 SDK is left out here.
  test-arm64:
    name: Test (macOS 26, Apple Silicon)
    if: github.event.action != 'closed'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: System Environment Info
        run: |
          echo "Host OS: $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          echo "Architecture: $(uname -m)"
          echo "Swift CLI: $(swift --version | head -n 1)"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          [[ "$(sw_vers -productVersion)" == 26.* ]]

      - name: Ensure Executable Permissions
        run: chmod +x test.sh build.sh build_release.sh

      # Xcode 26.6 build products: a cache of their own, apart from the Xcode 27 build job's.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-xcode26-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-xcode26-

      - name: Run Unit Tests
        run: ./test.sh

      - name: Verify Publisher Excerpts
        run: NEWS_NATIVE_HARNESS=Tests/PublisherExcerptTests.swift ./script/native_performance_baseline.sh

      - name: Verify Swift Package Manager Build
        run: swift build --force-resolved-versions --target News

  build-arm64:
    name: Build Verification (Apple Silicon)
    if: github.event.action != 'closed'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags and commit count stamp the bundle version

      - name: Ensure Executable Permissions
        run: chmod +x build_release.sh

      # On the shipping toolchain: swift-format output can differ between Xcode versions.
      - name: Check Swift Formatting
        run: script/format.sh --check

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-xcode27-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-xcode27-

      - name: Build Ad-hoc arm64 Verification Bundle
        run: ./build_release.sh

      - name: Verify Bundle Integrity & Hardened Runtime
        run: |
          set -euo pipefail
          test -d "News.app"
          test -x "News.app/Contents/MacOS/News"
          plutil -lint "News.app/Contents/Info.plist"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "News.app/Contents/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          ARCHS=$(lipo -archs "News.app/Contents/MacOS/News")
          echo "Found architectures: $ARCHS"
          [[ "$ARCHS" == arm64 ]]

          codesign --verify --deep --strict --verbose=2 "News.app"
          codesign -dvvv --entitlements :- "News.app"

          echo "Gatekeeper assessment (informational for ad-hoc signing):"
          spctl -a -vvv "News.app" || true

      - name: Archive Verification Bundle
        run: ditto -c -k --sequesterRsrc --keepParent News.app "News-${VERSION}-arm64-verification.zip"

      - name: Upload Verification Artifact
        uses: actions/upload-artifact@v7
        with:
          name: News-${{ env.VERSION }}-arm64-verification
          path: News-${{ env.VERSION }}-arm64-verification.zip
          if-no-files-found: error
