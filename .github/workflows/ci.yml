name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-arm64:
    name: Test (Apple Silicon)
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: System Environment Info
        run: |
          echo "Host OS: $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          echo "Architecture: $(uname -m)"
          echo "Swift CLI: $(swift --version | head -n 1)"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"

      - name: Ensure Executable Permissions
        run: chmod +x test.sh build.sh build_release.sh

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Run Unit Tests
        run: ./test.sh

      - name: Check Swift Formatting
        run: script/format.sh --check

      - name: Verify Publisher Excerpts
        run: NEWS_NATIVE_HARNESS=Tests/PublisherExcerptTests.swift ./script/native_performance_baseline.sh

      - name: Verify Swift Package Manager Build
        run: swift build --force-resolved-versions --target News

  build-arm64:
    name: Build Verification (Apple Silicon)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags and commit count stamp the bundle version

      - name: Ensure Executable Permissions
        run: chmod +x build_release.sh

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build Ad-hoc arm64 Verification Bundle
        run: ./build_release.sh

      - name: Verify Bundle Integrity & Hardened Runtime
        run: |
          set -euo pipefail
          test -d "News.app"
          test -x "News.app/Contents/MacOS/News"
          plutil -lint "News.app/Contents/Info.plist"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "News.app/Contents/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          ARCHS=$(lipo -archs "News.app/Contents/MacOS/News")
          echo "Found architectures: $ARCHS"
          [[ "$ARCHS" == arm64 ]]

          codesign --verify --deep --strict --verbose=2 "News.app"
          codesign -dvvv --entitlements :- "News.app"

          echo "Gatekeeper assessment (informational for ad-hoc signing):"
          spctl -a -vvv "News.app" || true

      - name: Archive Verification Bundle
        run: ditto -c -k --sequesterRsrc --keepParent News.app "News-${VERSION}-arm64-verification.zip"

      - name: Upload Verification Artifact
        uses: actions/upload-artifact@v7
        with:
          name: News-${{ env.VERSION }}-arm64-verification
          path: News-${{ env.VERSION }}-arm64-verification.zip
          if-no-files-found: error
