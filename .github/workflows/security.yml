name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  # `closed` starts a run in the PR's concurrency group, which cancels its in-flight run
  # so merged PRs stop holding macOS runners; every job skips on that run.
  # The group keys on the PR number: a merged PR's `closed` run has `github.ref` set to
  # main, so a ref-keyed group would cancel main's run instead of the PR's.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (Swift)
    if: github.event.action != 'closed'
    permissions:
      contents: read
      security-events: write
    # Keep extraction on a supported stable toolchain; normal CI tests Xcode 27.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # CodeQL tracing requires Rosetta on Apple Silicon, including compiler
      # subprocesses. The application itself is still compiled only for arm64.
      - name: Prepare CodeQL tracing runtime
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      # Extract all app sources without release optimization or bundle packaging.
      # Disable only compiler subprocess sandboxing on this disposable runner;
      # application sandbox entitlements remain unchanged.
      - name: Build arm64 sources for CodeQL
        run: swift build --force-resolved-versions --target News --arch arm64 --jobs 3 --disable-sandbox -Xswiftc -disable-sandbox

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"

  codeql-actions:
    name: CodeQL (Actions)
    if: github.event.action != 'closed'
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret Scan
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown

  swift-security-tests:
    name: Swift Security Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run security-focused test suite
        run: ./test.sh
