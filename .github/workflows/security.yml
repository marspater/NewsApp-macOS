name: Security

# No path filter on the workflow: a secret can sit in any file, documentation included. The `changes` job decides
# which analyses have something to read.
on:
  push:
    branches: [main]
  # `closed` starts a run in the PR's concurrency group, which cancels its in-flight run
  # so merged PRs stop holding macOS runners; every job skips on that run.
  # The group keys on the PR number: a merged PR's `closed` run has `github.ref` set to
  # main, so a ref-keyed group would cancel main's run instead of the PR's.
  # Every base branch, so the pull requests of a stack are scanned too.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their older run; main queues, so its code scanning finishes instead of being cancelled by the
# next merge (22 of 30 sampled Swift analyses on main were, 12 to 14 November).
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed, against the pull request's merge base with its base branch, or for a push the last main commit
  # this workflow finished on (a replaced waiting run is covered by the newer one). The weekly and manual runs
  # analyse everything.
  changes:
    name: Security Paths
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # script/ci_push_base.sh reads this workflow's finished runs on main
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect analysed paths
        id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) changed=$(git diff --name-only "$(git merge-base "$PR_BASE" "$PR_HEAD")" "$PR_HEAD") || changed=ALL ;;
            push) changed=$(git diff --name-only "$(script/ci_push_base.sh security.yml "$BEFORE")" "$GITHUB_SHA") || changed=ALL ;;
            *) changed=ALL ;;
          esac
          # What `swift build --target News` compiles, and this workflow.
          grep -Eq '^(ALL$|Sources/|BuildSupport/|Package\.(swift|resolved)$|\.github/workflows/security\.yml$)' <<< "$changed" \
            && echo swift=true >> "$GITHUB_OUTPUT" || echo swift=false >> "$GITHUB_OUTPUT"
          grep -Eq '^(ALL$|\.github/(workflows|actions)/)' <<< "$changed" \
            && echo workflows=true >> "$GITHUB_OUTPUT" || echo workflows=false >> "$GITHUB_OUTPUT"

  # The traced build takes 19 to 41 minutes, so it runs only when Swift the app compiles changed.
  codeql:
    name: CodeQL (Swift)
    needs: changes
    if: needs.changes.outputs.swift == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    permissions:
      contents: read
      security-events: write
    # Extraction stays on a toolchain the CodeQL Swift extractor supports, which can trail the 26.6 that ci.yml
    # tests with and the Xcode 27 it builds with.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    # The traced build took 19 to 31 minutes on 12 November 2026 and 41 on a busy runner the day after,
    # which left the analysis no room inside 45.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # CodeQL tracing requires Rosetta on Apple Silicon, including compiler
      # subprocesses. The application itself is still compiled only for arm64.
      - name: Prepare CodeQL tracing runtime
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      # Extract all app sources without release optimization or bundle packaging.
      # Disable only compiler subprocess sandboxing on this disposable runner;
      # application sandbox entitlements remain unchanged.
      - name: Build arm64 sources for CodeQL
        run: swift build --force-resolved-versions --target News --arch arm64 --jobs 3 --disable-sandbox -Xswiftc -disable-sandbox

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"

  codeql-actions:
    name: CodeQL (Actions)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret Scan
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown
