name: Profile

# Scheduled signpost recording (#577): one runner class, one workload, so weekly traces stay comparable.
# Never part of pull request checks; see docs/audits/2026-11-07-signpost-profiling.md.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'  # Mondays 04:17 UTC

concurrency:
  group: profile
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # the comparison step downloads the previous successful run's summary artifact

jobs:
  signposts:
    name: Signpost Recording (macOS 26, Apple Silicon)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 50
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # tags and commit count stamp the bundle version

      - name: System Environment Info
        run: |
          echo "Host: $(sysctl -n hw.model) $(sysctl -n machdep.cpu.brand_string)"
          echo "OS: $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          echo "Load: $(sysctl -n vm.loadavg)"

      - name: Test Signpost Summary and Comparison
        run: |
          python3 -m unittest discover -s script -p 'test_summarize_signposts.py'
          python3 -m unittest discover -s script -p 'test_compare_profile.py'
          python3 -m unittest discover -s script -p 'test_summarize_launches.py'
          bash script/test_paired_launch.sh

      - name: Record Signposts
        run: script/profile_signposts.sh "$RUNNER_TEMP/profile"

      # XCTest clock, memory and CPU metrics (#577): launch and one search on the smoke fixture. Only here, never in
      # ci.yml; the tests skip themselves unless NEWS_PERFORMANCE_TESTS reaches the runner.
      - name: Run Performance Tests
        if: always()
        run: |
          set -o pipefail
          # -configuration Profile: the optimized development build; NewsUITests launches the News.app built beside it.
          TEST_RUNNER_NEWS_PERFORMANCE_TESTS=1 xcodebuild test -project News.xcodeproj -scheme News \
            -testPlan UITests -configuration Profile -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            -only-testing:NewsUITests/NewsPerformanceTests \
            -resultBundlePath "$RUNNER_TEMP/NewsPerformanceTests.xcresult" -quiet
          # Clock, memory and CPU measurements beside summary.json, so the next run can compare against them. The
          # directory exists only if Record Signposts ran.
          mkdir -p "$RUNNER_TEMP/profile"
          xcrun xcresulttool get test-results metrics --path "$RUNNER_TEMP/NewsPerformanceTests.xcresult" \
            > "$RUNNER_TEMP/profile/metrics.json"
          # Skipped tests exit 0: require that both measured tests actually passed.
          passed=$(xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/NewsPerformanceTests.xcresult" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["passedTests"])')
          [[ "$passed" -ge 2 ]] || { echo "::error::Only $passed performance tests passed"; exit 1; }

      - name: Upload Performance Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-tests-xcresult-${{ github.run_id }}
          path: ${{ runner.temp }}/NewsPerformanceTests.xcresult
          if-no-files-found: warn
          retention-days: 90

      # Medians beside the previous successful run's (any branch, same runner class), with a warning past 25 %.
      # Warns only: hosted runners differ between runs. No committed .xcbaseline, which is keyed to one machine.
      - name: Compare With Previous Run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow profile.yml --status success --limit 20 \
            --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].databaseId // empty")
          dir="$RUNNER_TEMP/previous"
          if [[ -n "$previous" ]] && gh run download "$previous" --repo "$GITHUB_REPOSITORY" \
              --name "signpost-profile-$previous" --dir "$dir"; then
            echo "Previous successful run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$previous"
          else
            echo "No previous successful run with a summary artifact; showing this run alone"
            dir=""
          fi
          python3 script/compare_profile.py "$RUNNER_TEMP/profile" ${dir:+"$dir"} --tolerance 0.25 \
            > "$RUNNER_TEMP/profile/comparison.md" 2> "$RUNNER_TEMP/profile/warnings.txt"
          cat "$RUNNER_TEMP/profile/warnings.txt"  # ::warning:: lines become annotations on stdout
          { cat "$RUNNER_TEMP/profile/comparison.md"; echo; cat "$RUNNER_TEMP/profile/summary.md"; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trace and Summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signpost-profile-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/profile/News.trace
            ${{ runner.temp }}/profile/summary.json
            ${{ runner.temp }}/profile/summary.md
            ${{ runner.temp }}/profile/metrics.json
            ${{ runner.temp }}/profile/comparison.md
            ${{ runner.temp }}/profile/build.log
            ${{ runner.temp }}/profile/toc.xml
          if-no-files-found: warn
          retention-days: 90
