name: Temporary Swift 6 PR diagnostics
on:
  push:
    branches:
      - fix/swift6-modernization-2026-11-11
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  codacy-annotation:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve exact Codacy annotation from GitHub Checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "Codacy Static Code Analysis") | .id' | head -1)
            if [[ -n "$run_id" ]]; then
              state=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$run_id" --jq '.status')
              if [[ "$state" == "completed" ]]; then
                echo "Codacy check ID: $run_id"
                gh api "repos/$GITHUB_REPOSITORY/check-runs/$run_id/annotations" --paginate --jq '.[] | {path, start_line, end_line, annotation_level, message, title, raw_details}'
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Timed out awaiting Codacy annotation"
          exit 1

  swift-build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Xcode environment
        run: xcodebuild -version
      - name: Swift build for testing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project News.xcodeproj -scheme News -destination 'platform=macOS' -derivedDataPath build/DerivedData 2>&1 | tee /tmp/swift6-build.log
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift6-diagnostic-build-log
          path: /tmp/swift6-build.log
          if-no-files-found: ignore
