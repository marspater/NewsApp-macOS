name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '43 16 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab for testing

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues: mark stale after 60 days of inactivity, close 7 days later
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
            Thank you for your contributions!
          close-issue-message: >
            This issue has been automatically closed due to inactivity. Feel free
            to reopen it or open a new one if this problem persists.

          # PRs: tighter window (30 days inactivity, 7 days to close)
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: >
            This pull request has been automatically marked as stale due to 30 days
            of inactivity. It will be closed in 7 days if no updates are pushed.
          close-pr-message: >
            This pull request has been closed due to inactivity.

          # Protections: never close items with these attributes
          exempt-issue-labels: 'pinned,security,blocked,in-progress,help wanted'
          exempt-pr-labels: 'pinned,work-in-progress,dependencies'
          exempt-all-milestones: true
          exempt-all-assignees: true
