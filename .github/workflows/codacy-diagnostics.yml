name: Temporary Codacy Diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Codacy
        run: sleep 60
      - name: Fetch issue records
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url="https://api.codacy.com/api/v3/analysis/organizations/gh/marspater/repositories/NewsApp-macOS/pull-requests/$PR_NUMBER/issues?status=all&limit=100"
          for attempt in 1 2 3; do
            code=$(curl --location --silent --show-error --max-time 30 --output "$RUNNER_TEMP/issues.json" --write-out "%{http_code}" "$url" || true)
            echo "Codacy HTTP status: $code"
            if [[ "$code" == "200" ]]; then
              python3 - "$RUNNER_TEMP/issues.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          print("meta:",json.dumps({k:v for k,v in payload.items() if k!="data"},sort_keys=True))
          for issue in payload.get("data",[]):
              print(json.dumps(issue,sort_keys=True))
          PY
              break
            fi
            sleep 20
          done
