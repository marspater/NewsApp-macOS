# SonarQube Cloud automatic analysis scope. Tests/ is test code, so main-code rules
# (such as fixed URIs in fixtures) do not apply to it; every other analyzed path stays main code.
sonar.sources=Sources,script,.github,Package.swift,build.sh,build_release.sh,test.sh
sonar.tests=Tests
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13
sonar.issue.ignore.multicriteria=s1,s2
sonar.issue.ignore.multicriteria.s1.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.s1.resourceKey=Sources/**/*
sonar.issue.ignore.multicriteria.s2.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.s2.resourceKey=Sources/Intelligence/**/*
# The Python taint rules (pythonsecurity:S2083, S8707) model every file read as an HTTP request, and
# rule-scoped ignores are not applied by automatic analysis. These maintainer-run tools take their own
# paths and have no request surface, so the files carrying those findings are left out of the scan.
sonar.exclusions=script/changelog_fold.py,script/evaluation/sample_pairs.py,script/evaluation/overview_review.py,script/evaluation/importance_review.py,script/evaluation/publisher_review.py,script/evaluation/publisher_dates.py,script/evaluation/build_corpus.py,script/evaluation/evaluate.py,script/training/train_embedding.py
