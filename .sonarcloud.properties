# SonarQube Cloud automatic analysis scope. Tests/ is test code, so main-code rules
# (such as fixed URIs in fixtures) do not apply to it; every other analyzed path stays main code.
sonar.sources=Sources,script,.github,Package.swift,build.sh,build_release.sh,test.sh
sonar.tests=Tests
sonar.issue.ignore.multicriteria=s1
sonar.issue.ignore.multicriteria.s1.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.s1.resourceKey=Sources/**/*
