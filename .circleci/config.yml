version: 2.1

commands:
  # Stops the macOS job early when the change cannot alter the app or its tests: documentation, changelog fragments,
  # GitHub and Codemagic configuration, review-bot and linter configuration. Anything else runs, so an unknown
  # path never skips a test. `.circleci/` is not on the list: a change to this pipeline must exercise it.
  halt-unless-app-changed:
    steps:
      - run:
          name: "Skip changes that cannot affect the app"
          command: |
            git fetch -q origin main || true
            base=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || true)
            if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then base=HEAD~1; fi
            unaffecting='(\.md$|^docs/|^LICENSE$|^NOTICE$|^changelog/|^\.github/|^codemagic\.yaml$|^\.codacy|^\.coderabbit\.yaml$|^\.sonarcloud\.properties$|^\.claude/|^\.gitignore$)'
            if changed=$(git diff --name-only "$base" HEAD) && [ -z "$(echo "$changed" | grep -vE "$unaffecting")" ]; then
              echo "No app, test or pipeline file changed since $base; skipping."
              circleci-agent step halt
            fi
  prepare-macos:
    steps:
      - run:
          name: "Ensure permissions"
          command: chmod +x test.sh build.sh build_release.sh script/build_test_runner.sh script/ci_testsuite.sh
      # Same paths and key scheme as the GitHub Actions cache. The release marker job (deploy-marker) builds nothing.
      - restore_cache:
          keys:
            - swiftpm-macos-xcode27-{{ checksum "Package.resolved" }}
            - swiftpm-macos-xcode27-

jobs:
  # Toolchain-free checks on a cheap Docker executor, so a failure here never starts a macOS machine.
  checks:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: "Design lint, evaluation and testsuite self-checks (Swift formatting runs in GitHub Actions)"
          command: |
            script/design_lint.sh
            for check in evaluate publisher_review publisher_dates overview_review importance_review relation_review catalog_review fit_pair_head; do
              python3 "script/evaluation/$check.py"
            done
            script/test_ci_testsuite.sh

  test-macos:
    macos:
      xcode: "27.0"
    steps:
      - checkout
      - halt-unless-app-changed
      - prepare-macos
      - run:
          name: "Run unit tests and regressions via Smarter Testing"
          # On the default branch Smarter Testing selects every atom; no pull request reads impact data any more.
          command: circleci testsuite run "unit tests" --analyze-tests=none
      # Native Swift Testing target (#1070), as on GitHub Actions; it holds the publisher-excerpt checks (#577).
      - run:
          name: "Run native tests"
          command: |
            set -o pipefail
            xcodebuild test -project News.xcodeproj -scheme News -destination 'platform=macOS' \
              -derivedDataPath build/DerivedData -testPlan Release \
              -resultBundlePath build/ci/NewsTests.xcresult -quiet
      - store_artifacts:
          path: build/ci/NewsTests.xcresult
          destination: native-tests-xcresult
      # NewsUITests (#1070), as on GitHub Actions.
      - run:
          name: "Run UI tests"
          command: |
            set -o pipefail
            xcodebuild test -project News.xcodeproj -scheme News -destination 'platform=macOS' \
              -derivedDataPath build/DerivedData -testPlan UITests -only-testing:NewsUITests \
              -resultBundlePath build/ci/NewsUITests.xcresult -quiet
      - store_artifacts:
          path: build/ci/NewsUITests.xcresult
          destination: ui-tests-xcresult
          when: always
      - run:
          name: "Verify Swift Package Manager build"
          command: swift build --force-resolved-versions --target News
      - save_cache:
          key: swiftpm-macos-xcode27-{{ checksum "Package.resolved" }}
          paths:
            - .build
            - build/DerivedData/SourcePackages
            - ~/Library/Caches/org.swift.swiftpm

  # Records a deployment of main in CircleCI's release tracking once test-macos passed. It builds nothing: the
  # arm64 verification build already runs on Codemagic and in GitHub's build job (audit item A5, 6 November 2026).
  # It only calls the CircleCI CLI, so it runs on the small Docker executor instead of a macOS machine.
  deploy-marker:
    docker:
      - image: cimg/base:2026.11@sha256:4e57f523172e8f5bbf9cb57393b80c964ac0e6c75ee70ebd8c980d11bb503c01
    resource_class: small
    steps:
      - run:
          name: "Record deployment start"
          command: |
            circleci run release plan news-app \
              --environment-name="default" \
              --component-name="NewsApp-macOS" \
              --target-version="$CIRCLE_SHA1"
            circleci run release update news-app --status=running
      - run:
          name: "Mark deployment SUCCESS"
          command: circleci run release update news-app --status=SUCCESS
          when: on_success
      - run:
          name: "Mark deployment FAILED"
          command: circleci run release update news-app --status=FAILED
          when: on_fail

workflows:
  build-and-test:
    jobs:
      - checks
      # macOS credits: GitHub Actions runs the unit atoms, native tests, UI tests and package build on every pull
      # request, so CircleCI's macOS job runs on main only. A pull request runs `checks` alone here.
      - test-macos:
          requires:
            - checks
          filters:
            branches:
              only: main
      - deploy-marker:
          requires:
            - test-macos
          filters:
            branches:
              only: main
