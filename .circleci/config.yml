version: 2.1

jobs:
  # Toolchain-free checks on a cheap Docker executor, so a failure here never starts a macOS machine.
  checks:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: "Design lint, evaluation and testsuite self-checks (Swift formatting runs in GitHub Actions)"
          command: |
            script/design_lint.sh
            for check in evaluate publisher_review publisher_dates overview_review importance_review relation_review catalog_review fit_pair_head; do
              python3 "script/evaluation/$check.py"
            done
            script/test_ci_testsuite.sh

  test-macos:
    macos:
      xcode: "27.0"
    steps:
      - checkout
      - run:
          name: "Skip documentation-only changes"
          command: |
            # Same rule as the pre-commit hook and the GitHub paths-ignore: Markdown anywhere or anything under docs/.
            git fetch -q origin main || true
            base=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || true)
            if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then base=HEAD~1; fi
            if changed=$(git diff --name-only "$base" HEAD) && [ -z "$(echo "$changed" | grep -vE '(\.md$|^docs/)')" ]; then
              echo "Documentation-only change since $base; skipping macOS tests."
              circleci-agent step halt
            fi
      - run:
          name: "Ensure permissions"
          command: chmod +x test.sh build.sh build_release.sh script/build_test_runner.sh script/ci_testsuite.sh
      - run:
          name: "Run unit tests and regressions via Smarter Testing"
          command: circleci testsuite run "unit tests"
      - run:
          name: "Standalone headless runners (Story Overview, reader accessibility, tension calibration)"
          command: |
            script/test_event_overview_accessibility.sh
            script/test_reader_accessibility.sh
            script/test_tension_calibration.sh
      - run:
          name: "Verify publisher excerpts"
          command: NEWS_NATIVE_HARNESS=Tests/PublisherExcerptTests.swift ./script/native_performance_baseline.sh
      - run:
          name: "Verify Swift Package Manager build"
          command: swift build --force-resolved-versions --target News

  deploy-marker:
    macos:
      xcode: "27.0"
    steps:
      - checkout
      - run:
          name: "Record deployment start"
          command: |
            circleci run release plan news-app \
              --environment-name="default" \
              --component-name="NewsApp-macOS" \
              --target-version="$CIRCLE_SHA1"
            circleci run release update news-app --status=running
      - run:
          name: "Build release artifact"
          command: ./build_release.sh
      - run:
          name: "Mark deployment SUCCESS"
          command: circleci run release update news-app --status=SUCCESS
          when: on_success
      - run:
          name: "Mark deployment FAILED"
          command: circleci run release update news-app --status=FAILED
          when: on_fail

workflows:
  build-and-test:
    jobs:
      - checks
      - test-macos:
          requires:
            - checks
      - deploy-marker:
          requires:
            - test-macos
          filters:
            branches:
              only: main
