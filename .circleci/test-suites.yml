---
name: unit tests
discover: script/test_atoms.sh
run: script/ci_testsuite.sh "<< outputs.junit >>" << test.atoms >>
analysis: script/ci_testsuite.sh --lcov "<< outputs.lcov >>" << test.atoms >>
options:
  store-test-results: true
  test-impact-analysis: true
  impact-key: news-unit-tests
  full-test-run-paths:
    - .circleci/test-suites.yml
    - test.sh
    - script/build_test_runner.sh
    - script/xcode_build.sh
    - script/ci_testsuite.sh
    - script/test_atoms.sh
    - Tests/Runner.swift
    - Tests/NewsTestSupport.swift
    - News.xcodeproj/**
    - Package.swift
    - Package.resolved
    # Fixtures are read at run time, which coverage cannot attribute to a test atom.
    - Tests/Fixtures/**
    # Distribution manifests are read at run time by testDistributionAndEntitlementsIntegrity.
    - News.entitlements
    - PrivacyInfo.xcprivacy
    - container-migration.plist
  # Each atom holds its own tests: a change there always runs its atom, whatever coverage attributes.
  test-selection-rules:
    - test-atom: Tests/NewsTests.swift
      include:
        - Tests/NewsTests.swift
    - test-atom: Tests/EpicNE2ETests.swift
      include:
        - Tests/EpicNE2ETests.swift
    - test-atom: Tests/StorageTests.swift
      include:
        - Tests/StorageTests.swift
    - test-atom: Tests/ActiveWorkCancellationTests.swift
      include:
        - Tests/ActiveWorkCancellationTests.swift
    - test-atom: Tests/SocketTests.swift
      include:
        - Tests/SocketTests.swift
    - test-atom: Tests/DiagnosticsTests.swift
      include:
        - Tests/DiagnosticsTests.swift
    - test-atom: Tests/UserInterfaceTests.swift
      include:
        - Tests/UserInterfaceTests.swift
    - test-atom: Tests/LifecycleTests.swift
      include:
        - Tests/LifecycleTests.swift
    - test-atom: Tests/ReaderTests.swift
      include:
        - Tests/ReaderTests.swift
    - test-atom: Tests/IntelligenceTests.swift
      include:
        - Tests/IntelligenceTests.swift
    - test-atom: Tests/ClusteringTests.swift
      include:
        - Tests/ClusteringTests.swift
    - test-atom: Tests/NetworkingTests.swift
      include:
        - Tests/NetworkingTests.swift
